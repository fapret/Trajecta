openapi: 3.0.3
info:
  title: Currícula docs
  description: |-
    API de Currícula con almacenamiento EMF/XMI por espacio de trabajo.
    Las operaciones de modelo requieren uuid y, salvo el listado/creación de facultades, faculty.
    Los nuevos clientes envían JSON; se conservan parámetros de consulta y formularios para los campos escalares.
    Los campos escalares del cuerpo JSON tienen precedencia sobre los parámetros del mismo nombre.
    Los identificadores de unidad y nombres de escala son estables. Los IDs EMF deben ser únicos en model.xmi,
    incluso entre tipos diferentes de objeto. Las escalas y referencias de requisitos pertenecen a la misma facultad.
    Las creaciones del servicio de autoría del modelo devuelven 201 y sus actualizaciones 200. Los errores del servicio de autoría usan {error: mensaje}.
    Las validaciones fallidas no modifican el modelo guardado.

    Para construir un modelo: crear facultad y carrera, crear escala, crear plan, crear materias/unidades,
    agregar cursos y evaluaciones, y finalmente editar los requisitos que dependan de unidades creadas después.
    La edición de una escala compartida afecta verificaciones posteriores de notas ya registradas sin reescribirlas.
    La escala efectiva es la de la unidad, luego la del plan de la inscripción del estudiante, luego los valores heredados.
    Las notas del estudiante siguen siendo enteras; los umbrales de las escalas admiten decimales finitos.
  version: 1.3.0
servers:
- url: http://localhost:8080/curricula_microservice
  description: Desarrollo local
paths:
  /Estudiante:
    get:
      tags:
      - Estudiantes
      summary: Listar estudiantes del espacio de trabajo
      operationId: listStudents
      parameters:
      - $ref: '#/components/parameters/Workspace'
      responses:
        '200':
          description: Lista de objetos {id,name} de estudiantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSummary'
        '400':
          description: Falta uuid.
        '404':
          description: No existe el espacio de trabajo.
    post:
      tags:
      - Estudiantes
      summary: Crear estudiante en el espacio de trabajo
      operationId: createStudentModel
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: El estudiante se guarda en students.xmi; respuesta de texto.
          content:
            text/plain:
              schema:
                type: string
  /Faculty:
    get:
      tags:
      - Modelo
      summary: Listar facultades o consultar una facultad
      operationId: getFaculty
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: faculty
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Si se omite, devuelve nombres de facultad; si se proporciona, devuelve sus datos.
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - $ref: '#/components/schemas/Facultad'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Modelo
      summary: Crear facultad
      operationId: createFaculty
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NameRequest/properties/name'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
            example:
              name: Engineering
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NameRequest'
  /Faculty/ucs:
    get:
      tags:
      - Modelo
      summary: Listar unidades curriculares o consultar una unidad
      operationId: getuc
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: curricularUnit
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: ID de la unidad a consultar. Omitir para listar las unidades de la facultad.
      - name: withName
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: En listados, true devuelve objetos {id,name}; false devuelve IDs.
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    type: string
                - type: array
                  items:
                    $ref: '#/components/schemas/NamedUnit'
                - $ref: '#/components/schemas/uc'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Modelo
      summary: Crear una unidad curricular
      operationId: createCurricularUnit
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateUnit/properties/id'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateUnit/properties/name'
      - name: cred
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateUnit/properties/cred'
      - name: valid
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateUnit/properties/valid'
      - name: gradeScale
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateUnit/properties/gradeScale'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uc'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON. También admite un requisito JSON crudo (o null), con id y demás
          datos escalares en consulta. Al crear, id y name son obligatorios.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateUnit'
              - $ref: '#/components/schemas/NullableRequirement'
            example:
              id: ALG2
              name: Algebra II
              cred: 10
              requirements: null
              memberships:
              - career: Computing
                plan: 2026
                subject: 101
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUnitForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUnitForm'
          text/plain:
            schema:
              type: string
              description: JSON de requisito serializado como texto; los datos escalares de la unidad van en los
                parámetros de consulta.
              example: '{"Exam":"ALG1"}'
    put:
      tags:
      - Modelo
      summary: Editar una unidad curricular sin cambiar su ID
      operationId: updateCurricularUnit
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateUnit/properties/id'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateUnit/properties/name'
      - name: cred
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateUnit/properties/cred'
      - name: valid
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateUnit/properties/valid'
      - name: gradeScale
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateUnit/properties/gradeScale'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uc'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON. También admite un requisito JSON crudo (o null), con id y demás
          datos escalares en consulta. Al crear, id y name son obligatorios.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/UpdateUnit'
              - $ref: '#/components/schemas/NullableRequirement'
            example:
              id: ALG2
              requirements:
                SomeOf:
                - 2
                - Coursed: ALG1
                - Exam: MAT1
              gradeScale: null
              memberships:
              - career: Computing
                plan: 2026
                subject: 101
              - career: Computing
                plan: 2027
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUnitForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUnitForm'
          text/plain:
            schema:
              type: string
              description: JSON de requisito serializado como texto; los datos escalares de la unidad van en los
                parámetros de consulta.
              example: '{"Exam":"ALG1"}'
  /Faculty/Carrera:
    get:
      tags:
      - Modelo
      summary: Consultar una carrera
      operationId: getCarrera
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - $ref: '#/components/parameters/Career'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Modelo
      summary: Crear carrera
      operationId: createCareer
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NameRequest/properties/name'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
            example:
              name: Computing
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NameRequest'
  /Faculty/Carrera/Plan:
    get:
      tags:
      - Modelo
      summary: Consultar un plan de créditos o materias
      operationId: getPlan
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - $ref: '#/components/parameters/Career'
      - $ref: '#/components/parameters/PlanYear'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Modelo
      summary: Crear un plan de créditos o materias
      operationId: createPlan
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: career
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/career'
      - name: plan
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/plan'
      - name: planType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/planType'
      - name: minCred
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/minCred'
      - name: valid
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/valid'
      - name: gradeScale
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreatePlan/properties/gradeScale'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlan'
            example:
              career: Computing
              plan: 2026
              planType: 0
              minCred: 90
              gradeScale: Standard
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePlan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePlan'
    put:
      tags:
      - Modelo
      summary: Cambiar la escala de un plan
      operationId: assignPlanGradeScale
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: career
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssignPlanScale/properties/career'
      - name: plan
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssignPlanScale/properties/plan'
      - name: gradeScale
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssignPlanScale/properties/gradeScale'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPlanScale'
            example:
              career: Computing
              plan: 2026
              gradeScale: Standard
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignPlanScale'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignPlanScale'
  /Faculty/Carrera/Plan/ucs:
    get:
      summary: Obtener información de las UCs de un plan
      operationId: getUCPlan
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - $ref: '#/components/parameters/Career'
      - $ref: '#/components/parameters/PlanYear'
      - name: withName
        in: query
        required: false
        schema:
          type: boolean
        description: true devuelve objetos {id,name}; en otro caso devuelve IDs.
      - name: valid_flag
        in: query
        required: false
        schema:
          type: boolean
        description: Cualquier valor presente filtra unidades vigentes; omitir para no filtrar.
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    type: string
                - type: array
                  items:
                    $ref: '#/components/schemas/NamedUnit'
        '404':
          description: Plan not found
  /Faculty/Carrera/Plan/Subjects:
    get:
      tags:
      - Modelo
      summary: Listar IDs de materias o consultar una materia
      operationId: getPlanSubject
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - $ref: '#/components/parameters/Career'
      - $ref: '#/components/parameters/PlanYear'
      - name: subject
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: ID de materia. Si se omite, devuelve IDs de todas las materias, incluidas las anidadas.
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - $ref: '#/components/schemas/materia'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Modelo
      summary: Crear una materia, opcionalmente anidada
      operationId: createSubject
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: career
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/career'
      - name: plan
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/plan'
      - name: subjectID
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/subjectID'
      - name: subjectName
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/subjectName'
      - name: subjectCredits
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/subjectCredits'
      - name: Parent
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateSubject/properties/Parent'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/materia'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubject'
            example:
              career: Computing
              plan: 2026
              subjectID: 101
              subjectName: Matemática
              subjectCredits: 20
              Parent: 100
              curricularUnits:
              - ALG1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSubjectForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSubjectForm'
  /Estudiante/AddPlan:
    post:
      summary: Agrega una inscripción a plan a un modelo de estudiante
      operationId: addStudentPlan
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: faculty
        in: query
        description: Nombre de facultad
        required: true
        schema:
          type: string
      - name: career
        in: query
        description: Nombre de carrera
        required: true
        schema:
          type: string
      - name: plan
        in: query
        description: Id de plan
        required: true
        schema:
          type: integer
      - name: date
        in: query
        description: Fecha de inscripción
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Student'
      responses:
        '200':
          description: Resultado de la actualización en texto; el servicio heredado también puede devolver mensajes
            de error de dominio con estado 200.
          content:
            text/plain:
              schema:
                type: string
      description: Lee el modelo y los estudiantes del espacio de trabajo. No recibe ni devuelve archivos XMI en
        el cuerpo.
      tags:
      - Estudiantes
  /Estudiante/AddEvaluation:
    post:
      summary: Agrega una evaluación a un modelo de estudiante
      operationId: addStudentEval
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: faculty
        in: query
        description: Nombre de facultad
        required: true
        schema:
          type: string
      - name: career
        in: query
        description: Nombre de carrera
        required: true
        schema:
          type: string
      - name: plan
        in: query
        description: Id de plan
        required: true
        schema:
          type: integer
      - name: curricularunit
        in: query
        description: Id de UC
        required: true
        schema:
          type: string
      - name: evaluation
        in: query
        description: Texto de fecha tal como se obtiene al consultar la unidad (java.util.Date.toString()).
        required: true
        schema:
          type: string
      - name: nota
        in: query
        description: Nota obtenida
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Student'
      - name: type
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          enum:
          - 0
          - 1
          - 3
        description: 0 = CourseEvaluation, 1 = ExamEvaluation, 3 = PartialEvaluation. Este endpoint heredado no
          registra tutorías.
      responses:
        '200':
          description: Resultado de la actualización en texto; el servicio heredado también puede devolver mensajes
            de error de dominio con estado 200.
          content:
            text/plain:
              schema:
                type: string
      description: Lee el modelo y los estudiantes del espacio de trabajo. No recibe ni devuelve archivos XMI en
        el cuerpo.
      tags:
      - Estudiantes
  /Faculty/ucs/eval:
    post:
      summary: Evalúa los requerimientos de un estudiante en una UC en específico en el modelo
      operationId: eval
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: faculty
        in: query
        description: Nombre de facultad
        required: true
        schema:
          type: string
      - name: curricularUnit
        in: query
        description: Id de UC
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Student'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '404':
          description: Subject not found
      description: Lee el modelo y los estudiantes del espacio de trabajo. No recibe ni devuelve archivos XMI en
        el cuerpo.
      tags:
      - Evaluaciones
  /Faculty/Carrera/Plan/eval:
    post:
      summary: Evalúa qué UCs puede cursar un estudiante
      operationId: evalPlan
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - name: faculty
        in: query
        description: Nombre de facultad
        required: true
        schema:
          type: string
      - name: career
        in: query
        description: Nombre de carrera
        required: true
        schema:
          type: string
      - name: plan
        in: query
        description: Plan
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Student'
      - name: valid_flag
        in: query
        required: false
        schema:
          type: boolean
        description: La presencia del parámetro (incluso false) restringe el resultado a unidades vigentes. Omitir
          para incluir todas.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: CDIV
        '400':
          description: Malformed request
        '404':
          description: Plan not found
      description: Lee el modelo y los estudiantes del espacio de trabajo. No recibe ni devuelve archivos XMI en
        el cuerpo.
      tags:
      - Evaluaciones
  /Faculty/Carrera/Plan/evaluations:
    get:
      tags:
      - Evaluaciones

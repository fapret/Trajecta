      - name: year
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateCourse/properties/year'
      - name: edition
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateCourse/properties/edition'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':

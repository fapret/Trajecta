      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/name'
      - name: examApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/examApprovalGrade'
      - name: courseApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/courseApprovalGrade'
      - name: coursePartialApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/coursePartialApprovalGrade'
      - name: partialApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/partialApprovalGrade'
      - name: tutoringApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UpdateGradeScale/properties/tutoringApprovalGrade'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeScale'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGradeScale'
            example:
              name: Standard
              examApprovalGrade: 3.5
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateGradeScale'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateGradeScale'
  /Workspaces:
    get:
      tags:
      - Espacios de trabajo
      summary: Listar espacios de trabajo
      operationId: listWorkspaces
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      tags:
      - Espacios de trabajo
      summary: Crear un espacio de trabajo vacío
      operationId: createWorkspace
      parameters:
      - name: uuid
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: ID nuevo, sin separadores de ruta. También puede enviarse como campo de formulario.
      responses:
        '200':
          description: 'Respuesta heredada: concatena texto de confirmación y un objeto JSON; el cuerpo completo
            no es JSON válido aunque el servidor declare application/json.'
          content:
            application/json:
              example: Workspace created successfully{"workspace":"demo"}
        '400':
          description: ID/ruta inválido.
        '409':
          description: El espacio ya existe; no se sobrescribe.
        '500':
          description: No se pudo crear o guardar el espacio.
components:
  schemas:
    uc:
      type: object
      required:
      - Id
      - Name
      - Cred
      - Valid
      - GradeScale
      - Memberships
      - Requirement
      - ExamEvaluation
      - Course
      properties:
        Id:
          type: string
        Name:
          type: string
        Cred:
          type: integer
          minimum: 0
        Valid:
          type: boolean
        GradeScale:
          type: string
          minLength: 1
          description: Escala propia de la unidad. null elimina la asignación y utiliza la escala del plan o los
            valores heredados.
          nullable: true
        Memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          description: Lista completa de pertenencias a planes/materias de la facultad.
        Requirement:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          maxItems: 1
          description: Arreglo vacío cuando la unidad no tiene requisitos; en otro caso contiene una única expresión.
        ExamEvaluation:
          type: array
          items:
            type: string
            description: Fecha serializada mediante java.util.Date.toString(); no es una fecha ISO.
            example: Thu Nov 05 03:00:00 UTC 2026
        Course:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    Course:
      type: object
      required:
      - Year
      - Edition
      - CourseEvaluation
      - PartialEvaluation
      - TutoringEvaluation
      properties:
        Year:
          type: integer
          minimum: 1
        Edition:
          type: integer
          minimum: 1
        CourseEvaluation:
          type: array
          items:
            type: string
            description: Fecha serializada mediante java.util.Date.toString(); no es una fecha ISO.
            example: Thu Nov 05 03:00:00 UTC 2026
        PartialEvaluation:
          type: array
          items:
            type: string
            description: Fecha serializada mediante java.util.Date.toString(); no es una fecha ISO.
            example: Thu Nov 05 03:00:00 UTC 2026
        TutoringEvaluation:
          type: array
          items:
            type: string
            description: Fecha serializada mediante java.util.Date.toString(); no es una fecha ISO.
            example: Thu Nov 05 03:00:00 UTC 2026
    Facultad:
      type: object
      required:
      - Name
      - Careers
      - FacultyCU
      properties:
        Name:
          type: string
        Careers:
          type: array
          items:
            type: string
        FacultyCU:
          type: array
          items:
            type: string
    Carrera:
      type: object
      required:
      - Name
      - Plans
      properties:
        Name:
          type: string
        Plans:
          type: array
          items:
            type: integer
            minimum: 0
    PlanAbstract:
      type: object
      required:
      - Year
      - Career
      - Type
      - Valid
      - GradeScale
      properties:
        Year:
          type: integer
          minimum: 0
        Career:
          type: string
        Type:
          type: string
          enum:
          - CreditsPlan
          - SubjectPlan
        Valid:
          type: boolean
        GradeScale:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
          nullable: true
    Plan:
      oneOf:
      - $ref: '#/components/schemas/PlanCreditos'
      - $ref: '#/components/schemas/Planucs'
    PlanCreditos:
      allOf:
      - $ref: '#/components/schemas/PlanAbstract'
      - type: object
        required:
        - MinCredits
        - Subjects
        properties:
          Type:
            type: string
            enum:
            - CreditsPlan
          MinCredits:
            type: integer
            minimum: 0
          Subjects:
            type: array
            items:
              type: string
              description: ID de materia, incluidas las materias anidadas.
    Planucs:
      allOf:
      - $ref: '#/components/schemas/PlanAbstract'
      - type: object
        required:
        - Curricular Units
        properties:
          Type:
            type: string
            enum:
            - SubjectPlan
          Curricular Units:
            type: array
            items:
              type: string
    materia:
      type: object
      required:
      - Id
      - Name
      - MinCredits
      - Subjects
      - CurricularUnits
      properties:
        Id:
          type: string
          description: El ID entero se devuelve como texto.
        Name:
          type: string
        MinCredits:
          type: integer
          minimum: 0
        Subjects:
          type: array
          items:
            type: string
            description: ID de materia hija inmediata.
        CurricularUnits:
          type: array
          items:
            type: string
    Requerimiento:
      $ref: '#/components/schemas/Requirement'
    EvaluationFather:
      type: object
      required:
      - date
      properties:
        date:
          type: string
          example: 0001-01-01T00:00:00.000-0300
    Evaluation:
      type: object
      properties:
        type:
          type: string
          example: asignaturas:CourseEvaluation
          xml:
            attribute: true
        href:
          type: string
          example: model.xmi#//@Faculty.0/@FacultyCU.0/@Course.0/@CourseEvaluation.0
          xml:
            attribute: true
    StudentEvaluation:
      type: object
      required:
      - id
      - type
      - grade
      properties:
        id:
          type: string
          example: GAL1
        type:
          $ref: '#/components/schemas/EvaluationType'
        grade:
          type: integer
          example: 6
    ExamEvaluation:
      $ref: '#/components/schemas/EvaluationFather'
    CourseEvaluation:
      $ref: '#/components/schemas/EvaluationFather'
    RootEstudiante:
      type: object
      properties:
        Student:
          $ref: '#/components/schemas/Estudiante'
    PlanInscription:
      type: object
      required:
      - date
      properties:
        plan:
          type: object
          required:
          - type
          - href
          properties:
            type:
              type: string
              example: asignaturas:CreditsPlan
              xml:
                attribute: true
            href:
              type: string
              example: model.xmi#//@Faculty.0/@Careers.0/@plan.0
              xml:
                attribute: true
        date:
          type: string
          example: 0001-01-01T00:00:00.000-0300
          xml:
            attribute: true
        PlanCourseInscription:
          type: array
          items:
            $ref: '#/components/schemas/PlanCourseInscription'
        PlanStudentEvaluation:
          type: array
          items:
            $ref: '#/components/schemas/PlanStudentEvaluation'
    PlanCourseInscription:
      type: object
      required:
      - date
      properties:
        CUCourse:
          type: object
          required:
          - href
          properties:
            href:
              type: string
              example: model.xmi#//@Faculty.0/@FacultyCU.0/@Course.0
              xml:
                attribute: true
        date:
          type: string
          example: 0001-01-01T00:00:00.000-0300
          xml:
            attribute: true
    PlanStudentEvaluation:
      type: object
      required:
      - grade
      - evaluation
      properties:
        grade:
          type: integer
          example: 6
          xml:
            attribute: true
        evaluation:
          $ref: '#/components/schemas/Evaluation'
    Estudiante:
      type: object
      required:
      - id
      - name
      - carrera
      properties:
        id:
          type: string
          example: test
          xml:
            attribute: true
        name:
          type: string
          example: fulano
          xml:
            attribute: true
        StudentPlanInscription:
          type: array
          items:
            $ref: '#/components/schemas/PlanInscription'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    NameRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    SubjectPlanMembership:
      type: object
      required:
      - career
      - plan
      properties:
        career:
          type: string
          minLength: 1
        plan:
          type: integer
          minimum: 0
      not:
        required:
        - subject
      description: Pertenencia directa a un plan de materias (SubjectPlan); omitir subject.
    CreditPlanMembership:
      type: object
      required:
      - career
      - plan
      - subject
      properties:
        career:
          type: string
          minLength: 1
        plan:
          type: integer
          minimum: 0
        subject:
          type: integer
          minimum: 0
      description: Pertenencia a una materia de un plan de créditos. La materia puede estar anidada.
    Membership:
      oneOf:
      - $ref: '#/components/schemas/SubjectPlanMembership'
      - $ref: '#/components/schemas/CreditPlanMembership'
    Requirement:
      type: object
      properties:
        NOT:
          $ref: '#/components/schemas/Requirement'
        Coursed:
          type: string
          minLength: 1
          description: ID de una unidad cuyo curso debe estar aprobado.
        Exam:
          type: string
          minLength: 1
          description: ID de una unidad aprobada por examen o por aprobación completa del curso.
        RegisteredTo:
          type: string
          minLength: 1
          description: ID de una unidad con inscripción a curso.
        CreditsOnPlan:
          type: string
          description: Texto año,carrera,créditos. Requiere un CreditsPlan existente; créditos >= 0. El nombre de
            carrera no puede contener comas.
          example: 2026,Computing,60
        CreditsOnSubject:
          type: string
          description: Texto subjectID,créditos. La materia existente puede estar anidada; créditos >= 0.
          example: 101,20
        SomeOf:
          type: array
          items:
            oneOf:
            - type: integer
              minimum: 1
            - $ref: '#/components/schemas/Requirement'
          minItems: 2
          description: El primer elemento es el entero N; todos los restantes son requisitos no nulos. 1 <= N <=
            cantidad de requisitos. OpenAPI 3.0 no permite expresar tipos de posición en este arreglo; el servidor
            valida el orden.
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      anyOf:
      - required:
        - NOT
      - required:
        - Coursed
      - required:
        - Exam
      - required:
        - RegisteredTo
      - required:
        - CreditsOnPlan
      - required:
        - CreditsOnSubject
      - required:
        - SomeOf
      description: Exactamente un operador por objeto. Se permiten expresiones anidadas con menos de 64 niveles;
        todas las referencias deben existir en la facultad.
      example:
        SomeOf:
        - 2
        - Coursed: ALG1
        - Exam: MAT1
    NullableRequirement:
      type: object
      properties:
        NOT:
          $ref: '#/components/schemas/Requirement'
        Coursed:
          type: string
          minLength: 1
          description: ID de una unidad cuyo curso debe estar aprobado.
        Exam:
          type: string
          minLength: 1
          description: ID de una unidad aprobada por examen o por aprobación completa del curso.
        RegisteredTo:
          type: string
          minLength: 1
          description: ID de una unidad con inscripción a curso.
        CreditsOnPlan:
          type: string
          description: Texto año,carrera,créditos. Requiere un CreditsPlan existente; créditos >= 0. El nombre de
            carrera no puede contener comas.
          example: 2026,Computing,60
        CreditsOnSubject:
          type: string
          description: Texto subjectID,créditos. La materia existente puede estar anidada; créditos >= 0.
          example: 101,20
        SomeOf:
          type: array
          items:
            oneOf:
            - type: integer
              minimum: 1
            - $ref: '#/components/schemas/Requirement'
          minItems: 2
          description: El primer elemento es el entero N; todos los restantes son requisitos no nulos. 1 <= N <=
            cantidad de requisitos. OpenAPI 3.0 no permite expresar tipos de posición en este arreglo; el servidor
            valida el orden.
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      anyOf:
      - required:
        - NOT
      - required:
        - Coursed
      - required:
        - Exam
      - required:
        - RegisteredTo
      - required:
        - CreditsOnPlan
      - required:
        - CreditsOnSubject
      - required:
        - SomeOf
      description: Un requisito o null. null elimina los requisitos; al omitir el campo en PUT se conserva la expresión
        guardada.
      example:
        SomeOf:
        - 2
        - Coursed: ALG1
        - Exam: MAT1
      nullable: true
    NamedUnit:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    CreatePlan:
      type: object
      required:
      - career
      - plan
      - planType
      - gradeScale
      properties:
        career:
          type: string
          minLength: 1
        plan:
          type: integer
          minimum: 0
        planType:
          type: integer
          minimum: 0
          enum:
          - 0
          - 1
          description: 0 = CreditsPlan; 1 = SubjectPlan.
        minCred:
          type: integer
          minimum: 0
          default: 0
          description: Créditos mínimos; se utiliza solamente en CreditsPlan.
        valid:
          type: boolean
          default: true
        gradeScale:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
    AssignPlanScale:
      type: object
      required:
      - career
      - plan
      - gradeScale
      properties:
        career:
          type: string
          minLength: 1
        plan:
          type: integer
          minimum: 0
        gradeScale:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
    CreateSubject:
      type: object
      required:
      - career
      - plan
      - subjectID
      - subjectName
      properties:
        career:
          type: string
          minLength: 1
        plan:
          type: integer
          minimum: 0
        subjectID:
          type: integer
          minimum: 0
        subjectName:
          type: string
          minLength: 1
        subjectCredits:
          type: integer
          minimum: 0
          default: 0
        Parent:
          type: integer
          minimum: -1
          default: -1
          description: ID de materia superior del mismo plan; -1 significa sin padre.
        curricularUnits:
          type: array
          items:
            type: string
          default: []
    CreateUnit:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        cred:
          type: integer
          minimum: 0
          default: 0
        valid:
          type: boolean
          default: true
        gradeScale:
          type: string
          minLength: 1
          description: Escala propia de la unidad. null elimina la asignación y utiliza la escala del plan o los
            valores heredados.
          nullable: true
        requirements:
          $ref: '#/components/schemas/NullableRequirement'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          description: Lista completa de pertenencias a planes/materias de la facultad.
      description: Puede crearse sin requisitos; agregarlos mediante PUT cuando existan las unidades referenciadas.
    UpdateUnit:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        cred:
          type: integer
          minimum: 0
        valid:
          type: boolean
        gradeScale:
          type: string
          minLength: 1
          description: Escala propia de la unidad. null elimina la asignación y utiliza la escala del plan o los
            valores heredados.
          nullable: true
        requirements:
          $ref: '#/components/schemas/NullableRequirement'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          description: Reemplaza todas las pertenencias. [] elimina todas. Omitir el campo conserva la lista guardada.
      description: id identifica la unidad y no se renombra. Los campos omitidos se conservan. No se recrean cursos,
        evaluaciones ni referencias de estudiantes.
    CreateCourse:
      type: object
      required:
      - id
      - year
      properties:
        id:
          type: string
          minLength: 1
        year:
          type: integer
          minimum: 1
        edition:
          type: integer
          minimum: 1
          default: 1
    EvaluationType:
      type: string
      enum:
      - ExamEvaluation
      - CourseEvaluation
      - PartialEvaluation
      - TutoringEvaluation
    CreateExamEvaluation:
      type: object
      required:
      - id
      - type
      - date
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - ExamEvaluation
        date:
          type: string
          format: date
          description: YYYY-MM-DD, interpretado a medianoche en America/Montevideo.
    CreateCourseEvaluation:
      type: object
      required:
      - id
      - type
      - date
      - year
      - edition
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - CourseEvaluation
          - PartialEvaluation
          - TutoringEvaluation
        date:
          type: string
          format: date
          description: YYYY-MM-DD, interpretado a medianoche en America/Montevideo.
        year:
          type: integer
          minimum: 1
        edition:
          type: integer
          minimum: 1
    CreateEvaluation:
      oneOf:
      - $ref: '#/components/schemas/CreateExamEvaluation'
      - $ref: '#/components/schemas/CreateCourseEvaluation'
    CreateGradeScale:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
        examApprovalGrade:
          type: number
          format: float
          default: 3
          description: Umbral de aprobación de examen. Debe ser finito.
        courseApprovalGrade:
          type: number
          format: float
          default: 6
          description: Umbral de aprobación completa de la unidad mediante curso. Debe ser finito.
        coursePartialApprovalGrade:
          type: number
          format: float
          default: 3
          description: Umbral para obtener el curso y satisfacer Coursed; no implica aprobación completa de la unidad.
            Debe ser finito.
        partialApprovalGrade:
          type: number
          format: float
          default: 60
          description: Umbral de aprobación de parcial; no agrega automáticamente notas para aprobar cursos. Debe
            ser finito.
        tutoringApprovalGrade:
          type: number
          format: float
          default: 0
          description: Umbral de aprobación de tutoría; no otorga por sí solo aprobación completa de la unidad.
            Debe ser finito.
    UpdateGradeScale:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
        examApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de examen. Debe ser finito.
        courseApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación completa de la unidad mediante curso. Debe ser finito.
        coursePartialApprovalGrade:
          type: number
          format: float
          description: Umbral para obtener el curso y satisfacer Coursed; no implica aprobación completa de la unidad.
            Debe ser finito.
        partialApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de parcial; no agrega automáticamente notas para aprobar cursos. Debe
            ser finito.
        tutoringApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de tutoría; no otorga por sí solo aprobación completa de la unidad.
            Debe ser finito.
      description: name identifica una escala existente, no la renombra. Umbrales omitidos se conservan. Los cambios
        afectan verificaciones posteriores de todas las referencias, incluidas notas históricas.
    GradeScale:
      type: object
      required:
      - name
      - examApprovalGrade
      - courseApprovalGrade
      - coursePartialApprovalGrade
      - partialApprovalGrade
      - tutoringApprovalGrade
      - plans
      - curricularUnits
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
        examApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de examen. Debe ser finito.
        courseApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación completa de la unidad mediante curso. Debe ser finito.
        coursePartialApprovalGrade:
          type: number
          format: float
          description: Umbral para obtener el curso y satisfacer Coursed; no implica aprobación completa de la unidad.
            Debe ser finito.
        partialApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de parcial; no agrega automáticamente notas para aprobar cursos. Debe
            ser finito.
        tutoringApprovalGrade:
          type: number
          format: float
          description: Umbral de aprobación de tutoría; no otorga por sí solo aprobación completa de la unidad.
            Debe ser finito.
        plans:
          type: array
          items:
            type: object
            required:
            - career
            - plan
            properties:
              career:
                type: string
              plan:
                type: integer
                minimum: 0
        curricularUnits:
          type: array
          items:
            type: string
          description: IDs de unidades con asignación directa de esta escala; no incluye herencia a través del plan.
    StudentSummary:
      type: object

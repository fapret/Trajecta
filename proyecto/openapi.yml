          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateEvaluationForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateEvaluationForm'
  /Faculty/grade-scales:
    get:
      tags:
      - Escalas
      summary: Listar escalas o consultar una escala y sus referencias
      operationId: getGradeScales
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: name
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          description: Nombre estable de una escala perteneciente a la misma facultad.
        description: Si se omite, lista todas las escalas de la facultad.
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/GradeScale'
                - $ref: '#/components/schemas/GradeScale'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
    post:
      tags:
      - Escalas
      summary: Crear escala de calificaciones
      operationId: createGradeScale
      parameters:
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/name'
      - name: examApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/examApprovalGrade'
      - name: courseApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/courseApprovalGrade'
      - name: coursePartialApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/coursePartialApprovalGrade'
      - name: partialApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/partialApprovalGrade'
      - name: tutoringApprovalGrade
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CreateGradeScale/properties/tutoringApprovalGrade'
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeScale'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false

              id: ALG1
              year: 2026
              edition: 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCourse'
  /Faculty/ucs/evaluation:

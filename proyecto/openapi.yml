        description: Alternativa heredada al tipo del cuerpo JSON.
      responses:
        '201':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: false
        description: Enviar el cuerpo JSON o los campos escalares mediante consulta/formulario. Los requisitos y
          pertenencias estructurados requieren JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluation'
            example:
              id: ALG1
              type: ExamEvaluation

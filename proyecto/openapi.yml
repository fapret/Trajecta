  parameters:
    Workspace:
      name: uuid
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: ID del espacio de trabajo existente; no se admiten rutas ni separadores.
    Faculty:
      name: faculty
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Nombre de la facultad dentro del espacio de trabajo.
    Career:
      name: career
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Nombre de la carrera dentro de la facultad.
    PlanYear:
      name: plan
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
      description: Año que identifica al plan dentro de la carrera.
    Student:
      name: id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: ID del estudiante. Si se omite, se utiliza el primer estudiante del espacio de trabajo.
  responses:
    InvalidInput:
      description: JSON, tipo, número, fecha o referencia estructural inválida; no se guarda ningún cambio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No existe el espacio de trabajo, modelo, facultad u objeto referenciado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: La identidad ya existe (ID de modelo, carrera, año de plan, curso o tipo/fecha de evaluación).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ModelFailure:
      description: No se pudo cargar o guardar el modelo del espacio de trabajo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
- name: Espacios de trabajo
- name: Modelo

      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Faculty'
      - $ref: '#/components/parameters/Career'
      - $ref: '#/components/parameters/PlanYear'
      - $ref: '#/components/parameters/Student'
      responses:
        '200':
          description: Operación realizada correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentEvaluation'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ModelFailure'
  /Faculty/ucs/course:
